<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Admin</title><link rel="stylesheet" href="/admin.css"></head><body>
<div class="shell"><aside><h1>Panel Admin</h1><p>Edita la página publicada.</p><a href="/">↗ Ver sitio</a></aside><main><div class="topbar"><div><h2>Personalización</h2><small>Los cambios se guardan en el servidor.</small></div><button id="saveBtn">Guardar cambios</button></div><div id="status"></div>
<section class="card"><h3>Acceso</h3><label>Contraseña<input id="password" type="password"></label></section>
<section class="card"><h3>Identidad</h3><div class="grid"><label>Nombre<input data-key="brandName"></label><label>Tagline<input data-key="tagline"></label><label>Logo actual / URL<input data-key="logo"></label><label>Imagen principal / URL<input data-key="heroImage"></label><label>Subir logo<input type="file" data-upload="logo" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"></label><label>Subir portada<input type="file" data-upload="heroImage" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"></label></div><div class="preview-grid"><img id="preview-logo"><img id="preview-heroImage"></div></section>
<section class="card"><h3>Textos</h3><label>Título principal<textarea data-key="heroTitle"></textarea></label><label>Texto principal<textarea data-key="heroText"></textarea></label><label>Título historia<input data-key="storyTitle"></label><label>Historia 1<textarea data-key="storyText1"></textarea></label><label>Historia 2<textarea data-key="storyText2"></textarea></label></section>
<section class="card"><h3>Productos</h3><div class="grid"><label>Panadería<textarea data-list="bakeryItems"></textarea></label><label>Pastelería<textarea data-list="pastryItems"></textarea></label></div></section>
<section class="card"><h3>Galería</h3><div id="galleryEditor"></div><button class="secondary" id="addGallery">+ Agregar imagen</button></section>
<section class="card"><h3>Contacto</h3><div class="grid"><label>Ubicación<input data-key="location"></label><label>WhatsApp<input data-key="whatsapp"></label><label>Link WhatsApp<input data-key="whatsappLink"></label><label>Instagram<input data-key="instagram"></label><label>Link Instagram<input data-key="instagramLink"></label></div></section>
<section class="card"><h3>Colores</h3><p class="help">Haz clic en el recuadro de color o escribe el código HEX, por ejemplo <b>#3F475E</b>.</p><div class="colors" id="colors"></div></section>
</main></div><script src="/admin.js"></script></body></html>
