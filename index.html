<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOSEPAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header">
<a class="brand" href="#inicio"><img id="navLogo"><span id="navBrand">JOSEPAN</span></a>
<nav><a href="#historia">Historia</a><a href="#productos">Productos</a><a href="#galeria">Galería</a><a href="#contacto">Contacto</a></nav>
</header>
<main id="inicio">
<section class="hero">
<div class="hero-copy"><p class="eyebrow" id="tagline"></p><h1 id="heroTitle"></h1><p class="lead" id="heroText"></p><a class="cta" id="heroWhatsapp" target="_blank">Pídelo por WhatsApp</a></div>
<div class="hero-visual"><div class="logo-orbit"><img id="heroLogo"></div><img class="hero-photo" id="heroImage"></div>
</section>
<section id="historia" class="story section"><div class="section-number">01</div><div class="story-grid"><div><p class="eyebrow" id="storyEyebrow"></p><h2 id="storyTitle"></h2></div><div class="story-copy"><p id="storyText1"></p><p id="storyText2"></p></div></div></section>

<section id="contacto" class="contact section"><div class="section-number">04</div><p class="eyebrow">Escríbenos</p><h2 id="contactTitle"></h2><div class="contact-grid"><div><h4>Dónde estamos</h4><p id="location"></p></div><div><h4>WhatsApp</h4><a id="whatsapp"></a></div><div><h4>Instagram</h4><a id="instagram"></a></div></div></section>
</main>
<footer class="public-footer"><strong id="footerBrand">JOSEPAN</strong></footer>
<script src="/app.js"></script>
